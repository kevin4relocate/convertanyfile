name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  browser-smoke:
    name: Browser smoke (${{ matrix.label }})
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - label: Chromium desktop + mobile
            browser: chromium
            projects: --project=chromium-desktop --project=chromium-mobile
          - label: Firefox desktop
            browser: firefox
            projects: --project=firefox-desktop --workers=1
          - label: WebKit desktop
            browser: webkit
            projects: --project=webkit-desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist/
      - name: Install ${{ matrix.browser }} with network retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps ${{ matrix.browser }}; then
              exit 0
            fi
            echo "Browser dependency installation failed (attempt $attempt of 3)."
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          exit 1
      - name: Run ${{ matrix.label }} tests
        run: npm run test:e2e -- ${{ matrix.projects }}
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
