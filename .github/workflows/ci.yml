name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-browser-smoke:
    runs-on: ubuntu-latest
    # The launch regression suite covers 264 tests across desktop/mobile Chromium,
    # Firefox, and WebKit. Keep a single deterministic Playwright worker and give
    # the full gate enough time to finish instead of cancelling a healthy run.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit >/dev/null 2>&1
      - name: Browser smoke tests
        run: npm run test:e2e
