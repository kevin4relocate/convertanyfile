name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:text-tools
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  browser-smoke:
    name: Browser smoke (${{ matrix.label }})
    needs: validate
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - label: Chromium desktop + mobile
            browser: chromium
            projects: --project=chromium-desktop --project=chromium-mobile
          - label: Firefox desktop
            browser: firefox
            projects: --project=firefox-desktop --workers=1
          - label: WebKit desktop
            browser: webkit
            projects: --project=webkit-desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist/
      # Official Playwright image has browsers and OS libraries preinstalled.
      # Keep this image version aligned with @playwright/test in package-lock.json.
      - name: Run ${{ matrix.label }} tests
        run: npm run test:e2e -- ${{ matrix.projects }}
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
