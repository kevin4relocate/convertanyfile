# Astro generates only articles due as of the Vietnam date at build time.
# Run a fresh build, trigger Cloudflare deployment and verify public indexing endpoints.
name: Publish scheduled SEO guides

on:
  schedule:
    # 00:15 Vietnam = 17:15 UTC on the previous calendar day (no DST).
    - cron: '15 17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # Bootstrap a newly installed/changed schedule without waiting for tomorrow.
    paths:
      - '.github/workflows/publish-scheduled-guides.yml'

permissions:
  contents: write

concurrency:
  group: scheduled-seo-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 100
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Determine exactly which guide is due today
        id: publication
        run: node scripts/seo-publication-plan.mjs

      - name: Build and audit only when a guide is due
        if: steps.publication.outputs.due == 'true'
        run: |
          npm run build
          test -f "dist/guides/tool/\${{ steps.publication.outputs.slug }}/index.html"
          echo "Build includes the due guide: \${{ steps.publication.outputs.slug }}"

      - name: Request Cloudflare production build
        if: steps.publication.outputs.due == 'true'
        env:
          CF_DEPLOY_HOOK: \${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          GUIDE_DATE: \${{ steps.publication.outputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CF_DEPLOY_HOOK" ]]; then
            echo "Triggering the configured Cloudflare Pages production deploy hook."
            curl --fail --silent --show-error --location --retry 3 --request POST "$CF_DEPLOY_HOOK"
          else
            echo "::warning::CLOUDFLARE_DEPLOY_HOOK not set; trying Cloudflare's Git integration via a dated empty commit."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            marker="chore(seo): publish scheduled guides $GUIDE_DATE"
            if git log -100 --format=%s | grep -Fqx "$marker"; then
              echo "A publication-trigger commit already exists for $GUIDE_DATE."
            else
              git commit --allow-empty -m "$marker"
              git push origin HEAD:main
            fi
          fi

      - name: Confirm guide and XML sitemap are live
        if: steps.publication.outputs.due == 'true'
        run: node scripts/verify-live-seo-publication.mjs --date="\${{ steps.publication.outputs.date }}"

      - name: Note days without scheduled articles
        if: steps.publication.outputs.due != 'true'
        run: echo "Nothing due today; no unnecessary rebuild or deploy."
